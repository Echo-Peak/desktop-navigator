[package]
name = "desktop-navigator"
version = "1.0.0"
edition = "2021"
description = "Desktop Navigator"
default-run = "desktop-navigator"

[lib]
name = "desktop_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
navigator-core = { path = "../crates/core" }
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
